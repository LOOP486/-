# models.yaml —— 模型与角色路由
# 用法：复制本文件为 config/models.yaml 后填写（models.yaml 不入库）
# 模型引用格式为 provider/model，provider 必须在下方 providers 中定义
# litellm 模型名对照：https://docs.litellm.ai/docs/providers

providers:
  anthropic:
    api_key_env: ANTHROPIC_API_KEY
  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
  moonshot:
    base_url: https://api.moonshot.cn/v1
    api_key_env: MOONSHOT_API_KEY
    params: { temperature: 1 } # Kimi / moonshot-v1 系列兼容；kimi-k2.x 需要 temperature=1

roles:
  planner: deepseek/deepseek-v4-pro # 主控与规划：空间/UE 标准评测固定模型
  coder: deepseek/deepseek-v4-pro
  vision: moonshot/moonshot-v1-8k-vision-preview # Kimi 轻量视觉模型
  # 以下角色可选，未配置时回退到 planner（行为不变）：
  # judge: deepseek/deepseek-v4-pro
  # explorer: deepseek/deepseek-v4-pro

# 可选：角色级降级链——主模型限流/不可用时依次尝试
# fallbacks:
#   planner: [openai/gpt-4o, deepseek/deepseek-chat]
