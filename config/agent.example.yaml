# agent.yaml —— 工程与运行配置
# 用法：复制本文件为 config/agent.yaml 后按需修改（agent.yaml 不入库）

engine:
  root: "C:/Program Files/Epic Games/UE_5.5"
  version: "5.5"

project:
  uproject: "D:/MyGame/MyGame.uproject"

# 要挂载的 MCP server；permission 是该 server 全部工具的授权级别（4 级）
# read / write_safe：自动放行
# write_project：自动 checkpoint 后需确认（工程必须在 git 管理下）
# dangerous：白名单 + 人工确认双条件，默认拒绝
mcp_servers:
  ue_build:
    command: ["uv", "run", "python", "-m", "ue5agent.mcp_servers.ue_build"]
    permission: read
  repo_tools:
    command: ["uv", "run", "python", "-m", "ue5agent.mcp_servers.repo_tools"]
    permission: write_safe # 注意：其中 repo_restore 若要使用，应拆出来按 dangerous 挂载
  ue_editor:
    command: ["uv", "run", "python", "-m", "ue5agent.mcp_servers.ue_editor"]
    permission: read # 编辑器桥只读工具；前置：UE 编辑器开启（UnrealMCP 插件）
  ue_lifecycle:
    command: ["uv", "run", "python", "-m", "ue5agent.mcp_servers.ue_lifecycle"]
    permission: dangerous # 启动编辑器进程；还需加入下方 allowlist 才会放行

# dangerous 级工具白名单（白名单 + 人工确认双条件，缺一即拒）
permissions:
  allowlist:
    - ue_lifecycle__editor_launch

limits:
  max_iterations: 40
  max_tool_result_chars: 30000
