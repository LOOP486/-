    main_hall[0,0,14,12]，storage[0,12,5,4]，office[14,0,4,5]；
    main_hall 的 north 门 at=1,width=2 连接 storage，east 门 at=1,width=2 连接 office；
    stairs 使用 stair_2_001 at=[1,1] facing=north、from_level=0、to_level=1，避免楼梯净空堵门到门路线。
    使用 wb_build 落地后，必须用 wb_validate 校验，
