# 白盒空间黑盒评测：固定模型 + 完整 TaskRunner + 真实 UE 工具。
# 目标是评测 agent 自己把空间需求转成布局 DSL 的能力；不要手写布局 JSON 做补救。
# 本文件是标准空间能力回归集：prompt_id=spc-dst-space-v1 的题面冻结，后续变更请新建版本。
# 固定模型：planner/coder/judge/explorer=deepseek/deepseek-v4-pro；
# vision=moonshot/moonshot-v1-8k-vision-preview（Kimi 轻量视觉）。
# 跑法示例（任务文件已固定模型；--model 可省略，若传入必须一致）：
#   uv run ue5agent eval --suite ue --tasks evals/tasks/ue_space.yaml --model deepseek/deepseek-v4-pro --out evals/baselines/ue/space-deepseek-v4-pro-2026-06-14.json

- name: slab_branching_training_space
  prompt_id: spc-dst-space-v1
  prompt_locked: true
  planner_model: deepseek/deepseek-v4-pro
  vision_model: moonshot/moonshot-v1-8k-vision-preview
  prompt: >
    请自己设计并搭建一个默认 slab 白盒空间，真实尺度，单层：一个有中心厅、入口、
    两条转角走廊、两个侧室和一个尽端房间的训练场。多房间必须连通；内部共享墙只开门，
    不在内部共享墙开窗；外墙可以开窗。调用 wb_build 时请使用 prefix="SPC1"，
    layout_json 顶层写 origin=[20000, -10000, 0]，以便 6 个测试在同一片区域并排比较且互不重叠；
    使用默认 MI_PrototypeGrid_Gray 白盒材质。只测试空间结构，不要生成 gameplay；不要生成
    props、cover、spawn_points、routes；不要调用 viewport_screenshot。尽端房间中心距入口至少 16 格；
    不要把 end_room/尽端房间放在中心厅背后短直线处；不要放 PathStart/PathEnd 或任何标记立方体。
    推荐采用稳定训练场模板：entry[0,0,6,6]、central_hall[0,6,8,8]、
    east_corridor[8,6,8,4]、turn_corridor[16,6,4,12]、end_room[16,18,6,6]、
    west_corridor[-8,6,8,4]、west_side_room[-14,6,6,6]、east_side_room[20,8,6,6]；
    门洞统一 width=2：entry north at=2 ↔ central_hall south at=2，
    central_hall east at=1 ↔ east_corridor west at=1，
    east_corridor east at=2 ↔ turn_corridor west at=2，
    turn_corridor north at=1 ↔ end_room south at=1，
    central_hall west at=1 ↔ west_corridor east at=1，
    west_corridor west at=2 ↔ west_side_room east at=2，
    turn_corridor east at=3 ↔ east_side_room west at=1。只有外轮廓墙可开窗，
    不确定就不要开窗。
    使用 wb_build 落地后，必须用 wb_validate 校验，
    再用 navmesh_rebuild 和 path_test 验证入口到最远房间导航可达；path_test 必须测试入口到尽端房间，
    且至少一条 path_test 的 path_length >= 1500uu。不要使用 modular
    结构模式。最终简短报告验证结果。
  max_iterations: 40
  checks:
    - { type: run_succeeded }
    - { type: no_unrecovered_tool_errors }
    - { type: tool_called, tool: wb_build }
    - { type: fact_nonempty, kind: wb_build, path: folder_root }
    - { type: tool_called, tool: wb_validate }
    - { type: tool_called, tool: navmesh_rebuild }
    - { type: tool_called, tool: path_test }
    - { type: tool_not_called, tool: viewport_screenshot }
    - { type: fact_equals, kind: wb_validate, path: ok, equals: true }
    - { type: fact_equals, kind: wb_validate, path: metrics.structure_mode, equals: slab }
    - { type: fact_lte, kind: wb_validate, path: metrics.scale_warning_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.prop_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.spawn_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.route_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.parallel_wall_duplicate_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.wall_fragmentation_score, value: 1.5 }
    - type: fact_any
      kind: path_test
      where:
        - { path: reachable, equals: true }
        - { path: path_length, gte: 1500 }

- name: slab_loop_gallery_space
  prompt_id: spc-dst-space-v1
  prompt_locked: true
  planner_model: deepseek/deepseek-v4-pro
  vision_model: moonshot/moonshot-v1-8k-vision-preview
  prompt: >
    请自己设计并搭建一个默认 slab 白盒空间，真实尺度，单层：一个环形/回游动线的小型展厅，
    至少 6 个空间节点，包括前厅、长廊、转角展廊、背厅、侧厅和出口厅；需要有一条主回游路线，
    同时保留一个短捷径门洞。内部共享墙只允许门洞，不允许窗；窗只放外墙。调用 wb_build
    时请使用 prefix="SPC2"，layout_json 顶层写 origin=[25000, -10000, 0]，以便 6 个测试在同一片区域
    并排比较且互不重叠；使用默认 MI_PrototypeGrid_Gray 白盒材质。只测试空间结构，不要生成
    gameplay；不要生成 props、cover、spawn_points、routes；不要调用 viewport_screenshot。使用 wb_build 落地后，
    必须用 wb_validate 校验，再用 navmesh_rebuild 和 path_test 验证前厅到出口厅可达。
    推荐采用稳定的 2x3 环形模板：前厅[0,0,6,6]、长廊[6,0,6,6]、转角展廊[12,0,6,6]、
    背厅[12,6,6,6]、侧厅[6,6,6,6]、出口厅[0,6,6,6]；相邻共享墙门洞统一 at=2,width=2，
    主回游为前厅→长廊→转角展廊→背厅→侧厅→出口厅→前厅，短捷径为长廊 north ↔ 侧厅 south。
    只有 south/west/east/north 外边界开窗，不要在上述共享墙上开窗。
    不要使用 modular 结构模式。最终简短报告验证结果。
  max_iterations: 40
  checks:
    - { type: run_succeeded }
    - { type: no_unrecovered_tool_errors }
    - { type: tool_called, tool: wb_build }
    - { type: fact_nonempty, kind: wb_build, path: folder_root }
    - { type: tool_called, tool: wb_validate }
    - { type: tool_called, tool: navmesh_rebuild }
    - { type: tool_called, tool: path_test }
    - { type: tool_not_called, tool: viewport_screenshot }
    - { type: fact_equals, kind: wb_validate, path: ok, equals: true }
    - { type: fact_equals, kind: wb_validate, path: metrics.structure_mode, equals: slab }
    - { type: fact_lte, kind: wb_validate, path: metrics.scale_warning_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.prop_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.spawn_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.route_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.parallel_wall_duplicate_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.wall_fragmentation_score, value: 1.8 }
    - type: fact_any
      kind: path_test
      where:
        - { path: reachable, equals: true }
        - { path: path_length, gte: 400 }

