    大厅里放一段从 level 0 到 level 1 的楼梯以及楼梯间护墙，但不要创建任何二层 room。
    多房间必须连通；窗只放外墙。调用 wb_build 时请使用 prefix="SPC3"，
    layout_json 顶层写 origin=[30000, -10000, 0]，以便 6 个测试在同一片区域并排比较且互不重叠；
