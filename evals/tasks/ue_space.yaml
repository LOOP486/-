    - { type: tool_called, tool: navmesh_rebuild }
    - { type: tool_called, tool: path_test }
    - { type: tool_not_called, tool: viewport_screenshot }
    - { type: fact_equals, kind: wb_validate, path: ok, equals: true }
    - { type: fact_equals, kind: wb_validate, path: metrics.structure_mode, equals: slab }
    - { type: fact_lte, kind: wb_validate, path: metrics.scale_warning_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.prop_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.spawn_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.route_count, value: 0 }
    - { type: fact_lte, kind: wb_validate, path: metrics.parallel_wall_duplicate_count, value: 0 }
    - { type: fact_gte, kind: wb_validate, path: metrics.stair_count, value: 1 }
    - { type: fact_gte, kind: wb_validate, path: metrics.stairwell_count, value: 1 }
    - type: fact_any
      kind: path_test
      where:
        - { path: reachable, equals: true }
        - { path: path_length, gte: 500 }

